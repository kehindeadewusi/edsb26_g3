# Run `uv run pre-commit install` once to activate, then hooks run on every commit.
# Run all hooks on all files manually: `uv run pre-commit run -a`
repos:
  # Housekeeping
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  # Keep paired .ipynb (in notebooks/) and .py (percent) mirrors (in scripts/) in sync.
  # Uses plain --sync (mtime-based): the repo keeps .ipynb out of git via .gitignore,
  # so the official jupytext hook (--pre-commit-mode) would complain about the git index.
  # Only acts on paired files; plain .py modules are ignored (warning only).
  - repo: local
    hooks:
      - id: jupytext-sync
        name: jupytext sync
        language: python
        entry: jupytext --sync
        additional_dependencies: [jupytext>=1.19.6]
        require_serial: true
        types_or: [jupyter, markdown, python]

  # Format + imports + lint (ruff covers black and isort)
  # Runs after jupytext so both sides of a pair get the same formatting.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
