[project]
name = "edsb26-g3"
version = "0.1.0"
description = "EDSB26-G3 Bootcamp Project"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fg-data-profiling>=4.20.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupytext>=1.19.6",
    "openpyxl>=3.1.5",
    #"pandas>=3.0.6",
    "pandas>1.5,<3.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["telco"]
